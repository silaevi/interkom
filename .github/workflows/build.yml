        run: |
          mkdir -p app/src/main/java/com/example/intercom app/src/main/res/mipmap-xxxhdpi
          printf '%s\n' "$KT_SRC" > app/src/main/java/com/example/intercom/MainActivity.kt
          printf '%s\n' "$MF_SRC" > app/src/main/AndroidManifest.xml
          echo "$ICON_GZ" | tr -d ' \n' | base64 -d | gunzip > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo "::error::ICON_GZ corrupted"; exit 1; }
          grep -q "package com.example.intercom" app/src/main/java/com/example/intercom/MainActivity.kt || { echo "::error::KT_SRC corrupted"; exit 1; }
          grep -q "android.net.wifi.WifiP2pManager" app/src/main/java/com/example/intercom/MainActivity.kt || { echo "::error::KT_SRC missing P2P"; exit 1; }
          grep -q "</manifest>" app/src/main/AndroidManifest.xml || { echo "::error::MF_SRC corrupted"; exit 1; }
          grep -q "ic_launcher" app/src/main/AndroidManifest.xml || { echo "::error::MF_SRC missing icon"; exit 1; }
          echo "::notice::Kotlin lines: $(wc -l < app/src/main/java/com/example/intercom/MainActivity.kt)"
          echo "::notice::Kotlin bytes: $(wc -c < app/src/main/java/com/example/intercom/MainActivity.kt)"
          echo "::notice::Import lines: $(grep -c '^import ' app/src/main/java/com/example/intercom/MainActivity.kt)"
          echo "::notice::Icon bytes: $(wc -c < app/src/main/res/mipmap-xxxhdpi/ic_launcher.png)"

      - name: Fix encoding
        run: |
          for F in app/src/main/java/com/example/intercom/MainActivity.kt app/src/main/AndroidManifest.xml; do
            if ! iconv -f UTF-8 -t UTF-8 "$F" >/dev/null 2>&1; then
              iconv -f CP1251 -t UTF-8 "$F" > "$F.tmp" && mv "$F.tmp" "$F"
            fi
            sed -i 's/\r$//' "$F"
          done

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build_log.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -40 build_log.txt | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intercom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
