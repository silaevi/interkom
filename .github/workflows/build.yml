name: Build APK

"on":
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diagnose
        run: |
          FILE=app/src/main/java/com/example/intercom/MainActivity.kt
          echo "::notice::Total lines: $(wc -l < "$FILE")"
          grep -n "fun " "$FILE" | while IFS= read -r line; do
            echo "::notice::FUN: ${line:0:120}"
          done
          awk 'NR>=350 && NR<=402 {printf "::notice::%d| %s\n", NR, substr($0,1,120)}' "$FILE"

      - name: Write manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <application
                  android:allowBackup="true"
                  android:label="Интерком">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build_log.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Caused by|Exception|parsing|Unresolved" build_log.txt | head -25 | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intercom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
