
name: Build APK

"on":
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Write sources
        env:
          KT_SRC: |

            package com.example.intercom

            import android.Manifest
            import android.annotation.SuppressLint
            import android.app.Activity
            import android.bluetooth.BluetoothAdapter
            import android.content.BroadcastReceiver
            import android.content.Context
            import android.content.Intent
            import android.content.IntentFilter
            import android.content.pm.PackageManager
            import android.graphics.Color
            import android.graphics.Typeface
            import android.media.*
            import android.net.nsd.NsdManager
            import android.net.nsd.NsdServiceInfo
            import android.net.wifi.WifiManager
            import android.os.Build
            import android.os.Bundle
            import android.view.Gravity
            import android.view.View
            import android.view.ViewGroup
            import android.widget.*
            import java.lang.reflect.Proxy
            import java.net.DatagramPacket
            import java.net.DatagramSocket
            import java.net.InetAddress
            import java.nio.ByteBuffer
            import java.util.concurrent.CopyOnWriteArraySet
            import java.util.concurrent.atomic.AtomicInteger
            import kotlin.concurrent.thread
            import kotlin.random.Random

            class MainActivity : Activity() {

                companion object {
                    const val SAMPLE_RATE = 16000
                    const val AUDIO_PORT = 45678
                    const val SERVICE_TYPE = "_intercom._tcp."
                    const val SERVICE_PREFIX = "intercom-"
                    const val REQUEST_MIC = 1
                    const val PREFS = "intercom_prefs"
                    const val KEY_DELAY = "musicDelay"
                    const val KEY_THEME = "theme"
                    const val KEY_RELAY = "relay"
                    const val KEY_MUSIC_FIRST = "musicFirst"
                    const val KEY_VOICE_GAIN = "voiceGain"
                    const val KEY_TALK_VOL = "talkVolume"
                    const val MAX_HOPS = 3
                    const val HEADER = 9
                    const val SPEECH_RMS = 1200.0
                }

                private lateinit var nsdManager: NsdManager
                private lateinit var audioManager: AudioManager

                private val myId = Random.nextInt()
                private val seq = AtomicInteger(0)

                private val peers = CopyOnWriteArraySet<InetAddress>()
                private val foundDevices =
                    LinkedHashMap<String, NsdServiceInfo>()
                private val resolveQueue =
                    ArrayDeque<NsdServiceInfo>()
                private var resolving = false
                private var myServiceName: String? = null

                private var socket: DatagramSocket? = null
                private var running = false
                private var micEnabled = true
                private var musicDelaySec = 2
                private var themeMode = 0
                private var relayEnabled = true
                private var musicFirst = false
                private var voiceGain = 1.0f
                private var talkVolume = 100
                private var speechFrames = 0
                private var lastSearchTime = 0L

                private val recentPackets =
                    LinkedHashMap<Long, Boolean>()

                private var focusRequest: AudioFocusRequest? = null
                private var focusHeld = false
                private var lastSpeechTime = 0L

                private var echoTrack: AudioTrack? = null
                private var recvTrack: AudioTrack? = null
                private var scoActive = false

                private val PKG = "android.net.wifi."
                private val CLS_MGR =
                    PKG + "Wifi" + "P2pManager"
                private var p2pObj: Any? = null
                private var p2pCh: Any? = null
                private var owner: InetAddress? = null
                private val p2pTried =
                    CopyOnWriteArraySet<String>()
                private var intentPeers = ""
                private var intentConn = ""

                private lateinit var mainScreen: LinearLayout
                private lateinit var settingsScreen: LinearLayout

                private lateinit var statusView: TextView
                private lateinit var devicesView: TextView
                private lateinit var micButton: Button
                private lateinit var foundListLayout: LinearLayout
                private var talkVolumeBar: SeekBar? = null
                private var musicVolumeBar: SeekBar? = null
                private var voiceGainBar: SeekBar? = null
                private var voiceGainLabel: TextView? = null

                private var delaySpinner: Spinner? = null
                private var themeSpinner: Spinner? = null
                private var relayCheck: CheckBox? = null
                private var musicFirstCheck: CheckBox? = null

                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    title = "Интерком"
                    audioManager = getSystemService(
                        Context.AUDIO_SERVICE) as AudioManager
                    volumeControlStream = AudioManager.STREAM_MUSIC

                    val prefs = getSharedPreferences(
                        PREFS, Context.MODE_PRIVATE)
                    musicDelaySec =
                        prefs.getInt(KEY_DELAY, 2).coerceIn(0, 5)
                    themeMode = prefs.getInt(KEY_THEME, 0)
                    relayEnabled =
                        prefs.getBoolean(KEY_RELAY, true)
                    musicFirst =
                        prefs.getBoolean(KEY_MUSIC_FIRST, false)
                    voiceGain =
                        prefs.getInt(KEY_VOICE_GAIN, 100) / 100f
                    talkVolume =
                        prefs.getInt(KEY_TALK_VOL, 100)
                            .coerceIn(0, 100)

                    buildUi()

                    val perms = ArrayList<String>()
                    perms.add(Manifest.permission.RECORD_AUDIO)
                    perms.add(
                        Manifest.permission.ACCESS_FINE_LOCATION)
                    if (Build.VERSION.SDK_INT >= 33) {
                        perms.add(
                            Manifest.permission.NEARBY_WIFI_DEVICES)
                    }
                    requestPermissions(
                        perms.toTypedArray(), REQUEST_MIC)
                }

                override fun onRequestPermissionsResult(
                    requestCode: Int,
                    permissions: Array<out String>,
                    grantResults: IntArray
                ) {
                    super.onRequestPermissionsResult(
                        requestCode, permissions, grantResults)
                    if (requestCode == REQUEST_MIC) {
                        var micOk = false
                        for (i in grantResults.indices) {
                            if (permissions[i] ==
                                Manifest.permission.RECORD_AUDIO &&
                                grantResults[i] ==
                                PackageManager.PERMISSION_GRANTED
                            ) micOk = true
                        }
                        if (micOk) startAll()
                        else setStatus(
                            "Нет разрешения на микрофон", false)
                    }
                }

                private fun startAll() {
                    val wifi = applicationContext.getSystemService(
                        Context.WIFI_SERVICE) as WifiManager
                    val lock = wifi.createMulticastLock(
                        "intercom-lock")
                    lock.setReferenceCounted(false)
                    lock.acquire()

                    enableBluetoothSco()
                    initP2p()

                    running = true
                    socket = try {
                        DatagramSocket(AUDIO_PORT).apply {
                            broadcast = true
                            reuseAddress = true
                        }
                    } catch (e: Exception) {
                        null
                    }
                    if (socket == null) {
                        setStatus(
                            "Порт занят. Перезапустите приложение",
                            false)
                        return
                    }

                    thread(name = "recv") { receiveLoop() }
                    thread(name = "send") { sendLoop() }
                    thread(name = "hello") { helloLoop() }
                    registerNsd()
                    setStatus(
                        "Микрофон активен. Поиск: Wi-Fi Direct + broadcast",
                        true)
                }

                @SuppressLint("MissingPermission")
                private fun enableBluetoothSco() {
                    try {
                        val bt = BluetoothAdapter.getDefaultAdapter()
                        if (bt == null || !bt.isEnabled) return
                        if (Build.VERSION.SDK_INT >=
                            Build.VERSION_CODES.S) {
                            val scoDevice =
                                audioManager
                                    .availableCommunicationDevices
                                    .firstOrNull {
                                        it.type ==
                                        AudioDeviceInfo
                                            .TYPE_BLUETOOTH_SCO
                                    }
                            if (scoDevice != null) {
                                audioManager
                                    .setCommunicationDevice(scoDevice)
                                scoActive = true
                            }
                        } else {
                            audioManager.startBluetoothSco()
                            audioManager.isBluetoothScoOn = true
                            scoActive = true
                        }
                    } catch (e: SecurityException) {
                        // Нет разрешения на Bluetooth,
                        // используется обычный микрофон
                    }
                }

                // ============ Wi-Fi Direct без роутера ============

                private fun p2pListener(name: String): Any {
                    val ifc = Class.forName(
                        CLS_MGR + "\$" + name)
                    return Proxy.newProxyInstance(
                        javaClass.classLoader, arrayOf(ifc)
                    ) { _, m, args ->
                        if (m.name == "onPeersAvailable" &&
                            args != null && args.isNotEmpty()) {
                            val l = args[0]
                            runOnUiThread { handlePeerList(l!!) }
                        }
                        if (m.name == "onConnectionInfoAvailable" &&
                            args != null && args.isNotEmpty()) {
                            val i = args[0]
                            runOnUiThread { handleConnInfo(i!!) }
                        }
                        null
                    }
                }

                private fun initP2p() {
                    val cls = try {
                        Class.forName(CLS_MGR)
                    } catch (e: Exception) {
                        null
                    }
                    if (cls == null) return
                    try {
                        p2pObj = getSystemService(
                            Context.WIFI_P2P_SERVICE)
                        if (p2pObj == null) return
                        val init = p2pObj!!.javaClass.methods.first {
                            it.name == "initialize" &&
                                it.parameterTypes.size == 3 }
                        p2pCh = init.invoke(
                            p2pObj, this, mainLooper, null)
                        intentPeers = cls
                            .getField(
                                "WIFI_P2P_" + "PEERS_CHANGED_ACTION")
                            .get(null) as String
                        intentConn = cls
                            .getField(
                                "WIFI_P2P_" + "CONNECTION_CHANGED_ACTION")
                            .get(null) as String
                        val f = IntentFilter()
                        f.addAction(intentPeers)
                        f.addAction(intentConn)
                        registerReceiver(p2pReceiver, f)
                        startDiscover()
                    } catch (e: Exception) {
                        setStatus(
                            "Wi-Fi Direct недоступен: ${e.message}",
                            false)
                    }
                }

                private val p2pReceiver =
                    object : BroadcastReceiver() {
                        override fun onReceive(
                            c: Context, i: Intent
                        ) {
                            if (i.action == intentPeers) {
                                requestPeersNow()
                            }
                            if (i.action == intentConn) {
                                requestConnInfoNow()
                            }
                        }
                    }

                private fun requestPeersNow() {
                    try {
                        val mgr = p2pObj ?: return
                        val ch = p2pCh ?: return
                        val l = p2pListener("PeerListListener")
                        val m = mgr.javaClass.methods.first {
                            it.name == "requestPeers" &&
                                it.parameterTypes.size == 2 }
                        m.invoke(mgr, ch, l)
                    } catch (e: Exception) {}
                }

                private fun startDiscover() {
                    try {
                        val mgr = p2pObj ?: return
                        val ch = p2pCh ?: return
                        val l = p2pListener("ActionListener")
                        val m = mgr.javaClass.methods.first {
                            it.name == "discoverPeers" &&
                                it.parameterTypes.size == 2 }
                        m.invoke(mgr, ch, l)
                    } catch (e: Exception) {}
                }

                private fun handlePeerList(list: Any) {
                    try {
                        val dev = list.javaClass
                            .getMethod("getDeviceList")
                            .invoke(list)
                        if (dev !is Collection<*>) return
                        val cls = Class.forName(
                            PKG + "Wifi" + "P2pDevice")
                        val ga = cls.getMethod("getDeviceAddress")
                        val gn = cls.getMethod("getDeviceName")
                        for (d in dev) {
                            if (d == null) continue
                            val addr = ga.invoke(d) as String
                            if (addr in p2pTried) continue
                            p2pTried.add(addr)
                            val nm = gn.invoke(d) as String
                            connectTo(addr, nm)
                        }
                    } catch (e: Exception) {}
                }

                private fun connectTo(addr: String, nm: String) {
                    try {
                        val mgr = p2pObj ?: return
                        val ch = p2pCh ?: return
                        val cfg = Class.forName(
                            PKG + "Wifi" + "P2pConfig").newInstance()
                        cfg.javaClass
                            .getField("deviceAddress")
                            .set(cfg, addr)
                        val l = p2pListener("ActionListener")
                        val m = mgr.javaClass.methods.first {
                            it.name == "connect" &&
                                it.parameterTypes.size == 3 }
                        m.invoke(mgr, ch, cfg, l)
                        setStatus(
                            "Wi-Fi Direct: подключаюсь к $nm", true)
                    } catch (e: Exception) {}
                }

                private fun requestConnInfoNow() {
                    try {
                        val mgr = p2pObj ?: return
                        val ch = p2pCh ?: return
                        val l =
                            p2pListener("ConnectionInfoListener")
                        val m = mgr.javaClass.methods.first {
                            it.name == "requestConnectionInfo" &&
                                it.parameterTypes.size == 2 }
                        m.invoke(mgr, ch, l)
                    } catch (e: Exception) {}
                }

                private fun handleConnInfo(info: Any) {
                    try {
                        val formed = info.javaClass
                            .getField("groupFormed")
                            .getBoolean(info)
                        if (!formed) return
                        val o = info.javaClass
                            .getField("groupOwnerAddress")
                            .get(info) as InetAddress
                        owner = o
                        if (peers.add(o)) {
                            setStatus(
                                "Wi-Fi Direct: соединение установлено. Говорите!",
                                true)
                            runOnUiThread { refreshLists() }
                        }
                    } catch (e: Exception) {}
                }

                // ============ Автопоиск: NSD + broadcast ============

                private fun registerNsd() {
                    nsdManager = getSystemService(
                        Context.NSD_SERVICE) as NsdManager

                    val info = NsdServiceInfo().apply {
                        serviceName = SERVICE_PREFIX +
                            Build.MODEL.replace(" ", "_")
                        serviceType = SERVICE_TYPE
                        port = AUDIO_PORT
                    }

                    nsdManager.registerService(
                        info, NsdManager.PROTOCOL_DNS_SD,
                        object : NsdManager.RegistrationListener {
                            override fun onServiceRegistered(
                                n: NsdServiceInfo
                            ) {
                                myServiceName = n.serviceName
                            }
                            override fun onRegistrationFailed(
                                n: NsdServiceInfo, e: Int
                            ) {}
                            override fun onServiceUnregistered(
                                n: NsdServiceInfo
                            ) {}
                            override fun onUnregistrationFailed(
                                n: NsdServiceInfo, e: Int
                            ) {}
                        })

                    nsdManager.discoverServices(
                        SERVICE_TYPE, NsdManager.PROTOCOL_DNS_SD,
                        object : NsdManager.DiscoveryListener {
                            override fun onDiscoveryStarted(
                                t: String
                            ) {}
                            override fun onStartDiscoveryFailed(
                                t: String, e: Int
                            ) {}
                            override fun onStopDiscoveryFailed(
                                t: String, e: Int
                            ) {}
                            override fun onDiscoveryStopped(
                                t: String
                            ) {}
                            override fun onServiceLost(
                                info: NsdServiceInfo
                            ) {}
                            override fun onServiceFound(
                                info: NsdServiceInfo
                            ) {
                                if (info.serviceName ==
                                    myServiceName) return
                                var isNew = false
                                synchronized(foundDevices) {
                                    if (!foundDevices.containsKey(
                                            info.serviceName)
                                    ) {
                                        foundDevices[
                                            info.serviceName] = info
                                        isNew = true
                                    }
                                }
                                if (isNew) {
                                    runOnUiThread { refreshLists() }
                                    queueResolve(info)
                                }
                            }
                        })
                }

                private fun queueResolve(info: NsdServiceInfo) {
                    synchronized(resolveQueue) {
                        resolveQueue.addLast(info)
                    }
                    tryResolveNext()
                }

                private fun tryResolveNext() {
                    val next: NsdServiceInfo =
                        synchronized(resolveQueue) {
                            if (resolving ||
                                resolveQueue.isEmpty()
                            ) return
                            resolving = true
                            resolveQueue.removeFirst()
                        }
                    try {
                        nsdManager.resolveService(
                            next,
                            object : NsdManager.ResolveListener {
                                override fun onServiceResolved(
                                    resolved: NsdServiceInfo
                                ) {
                                    val host = resolved.host
                                    if (host != null &&
                                        peers.add(host)
                                    ) {
                                        runOnUiThread {
                                            refreshLists()
                                        }
                                    }
                                    finishResolve()
                                }
                                override fun onResolveFailed(
                                    i: NsdServiceInfo, e: Int
                                ) {
                                    finishResolve()
                                }
                            })
                    } catch (e: Exception) {
                        finishResolve()
                    }
                }

                private fun finishResolve() {
                    synchronized(resolveQueue) { resolving = false }
                    tryResolveNext()
                }

                private fun helloLoop() {
                    var n = 0
                    while (running) {
                        try {
                            val out = buildPacket(
                                ByteArray(0), 0, myId,
                                seq.incrementAndGet(), 0)
                            socket?.send(
                                DatagramPacket(out, out.size,
                                    InetAddress.getByName(
                                        "255.255.255.255"),
                                    AUDIO_PORT))
                            owner?.let { o ->
                                socket?.send(
                                    DatagramPacket(out, out.size,
                                        o, AUDIO_PORT))
                            }
                            if (n % 4 == 0) startDiscover()
                        } catch (e: Exception) {}
                        n++
                        try {
                            Thread.sleep(3000)
                        } catch (e: InterruptedException) {
                            break
                        }
                    }
                }

                private fun handleHello(addr: InetAddress?) {
                    if (addr == null) return
                    if (peers.add(addr)) {
                        try {
                            val out = buildPacket(
                                ByteArray(0), 0, myId,
                                seq.incrementAndGet(), 0)
                            socket?.send(
                                DatagramPacket(out, out.size,
                                    addr, AUDIO_PORT))
                        } catch (e: Exception) {}
                        runOnUiThread { refreshLists() }
                    }
                }

                private fun refreshLists() {
                    devicesView.text = if (peers.isEmpty())
                        "нет подключений"
                    else peers.joinToString("\n") { "• $it" }
                    foundListLayout.removeAllViews()
                    val names: List<String> =
                        synchronized(foundDevices) {
                            foundDevices.keys.toList()
                        }
                    if (names.isEmpty()) {
                        foundListLayout.addView(
                            TextView(this).apply {
                                text = "Идёт автоматический поиск..."
                            })
                    } else {
                        for (name in names) {
                            foundListLayout.addView(
                                TextView(this).apply {
                                    text = "• ${name.removePrefix(
                                        SERVICE_PREFIX)}"
                                    textSize = 16f
                                })
                        }
                    }
                }

                private fun manualSearch() {
                    if (!running) {
                        setStatus("Поиск недоступен: приложение ещё не запущено", false)
                        return
                    }
                    val now = System.currentTimeMillis()
                    if (now - lastSearchTime < 3000) {
                        setStatus("Поиск уже запущен, подождите пару секунд", false)
                        return
                    }
                    lastSearchTime = now
                    startDiscover()
                    try {
                        val out = buildPacket(
                            ByteArray(0), 0, myId,
                            seq.incrementAndGet(), 0)
                        socket?.send(
                            DatagramPacket(out, out.size,
                                InetAddress.getByName("255.255.255.255"),
                                AUDIO_PORT))
                        owner?.let { o ->
                            socket?.send(
                                DatagramPacket(out, out.size, o, AUDIO_PORT))
                        }
                    } catch (e: Exception) {}
                    synchronized(foundDevices) { foundDevices.clear() }
                    resolveQueue.clear()
                    p2pTried.clear()
                    runOnUiThread { refreshLists() }
                    setStatus("Поиск устройств запущен", true)
                }

                // ================= Пакеты =================

                private fun buildPacket(
                    audio: ByteArray, audioLen: Int,
                    srcId: Int, seqNum: Int, ttl: Int
                ): ByteArray {
                    val bb = ByteBuffer.allocate(audioLen + HEADER)
                    bb.putInt(srcId)
                    bb.putInt(seqNum)
                    bb.put(ttl.toByte())
                    bb.put(audio, 0, audioLen)
                    return bb.array()
                }

                private fun isDuplicate(key: Long): Boolean {
                    synchronized(recentPackets) {
                        if (recentPackets.containsKey(key))
                            return true
                        recentPackets[key] = true
                        if (recentPackets.size > 512) {
                            val it =
                                recentPackets.entries.iterator()
                            if (it.hasNext()) {
                                it.next()
                                it.remove()
                            }
                        }
                        return false
                    }
                }

                private fun rmsOf(
                    bytes: ByteArray, offset: Int, len: Int
                ): Double {
                    var sum = 0.0
                    var count = 0
                    var i = offset
                    val end = offset + len - 1
                    while (i < end) {
                        val v = ((bytes[i].toInt() and 0xFF) or
                            (bytes[i + 1].toInt() shl 8))
                            .toShort().toDouble()
                        sum += v * v
                        count += 2
                        i += 2
                    }
                    return if (count == 0) 0.0
                    else Math.sqrt(sum / count)
                }

                // ============ Приём и ретрансляция ============

                private fun pcmOutFormat(): AudioFormat =
                    AudioFormat.Builder()
                        .setSampleRate(SAMPLE_RATE)
                        .setEncoding(
                            AudioFormat.ENCODING_PCM_16BIT)
                        .setChannelMask(
                            AudioFormat.CHANNEL_OUT_MONO).build()

                private fun receiveLoop() {
                    try {
                        val minBuf = AudioTrack.getMinBufferSize(
                            SAMPLE_RATE,
                            AudioFormat.CHANNEL_OUT_MONO,
                            AudioFormat.ENCODING_PCM_16BIT)
                        val track = AudioTrack(
                            AudioAttributes.Builder()
                                .setUsage(
                                    AudioAttributes.USAGE_MEDIA)
                                .setContentType(
                                    AudioAttributes
                                        .CONTENT_TYPE_SPEECH)
                                .build(),
                            pcmOutFormat(),
                            maxOf(minBuf, SAMPLE_RATE * 2),
                            AudioTrack.MODE_STREAM, 0)
                        recvTrack = track
                        track.setVolume(talkVolume / 100f)
                        track.play()

                        val buf = ByteArray(6400)
                        while (running) {
                            try {
                                val packet =
                                    DatagramPacket(buf, buf.size)
                                socket?.receive(packet)
                                if (packet.length < HEADER)
                                    continue

                                val bb = ByteBuffer.wrap(
                                    buf, 0, packet.length)
                                val srcId = bb.int
                                val rseq = bb.int
                                val ttl = bb.get().toInt()

                                if (srcId == myId) continue

                                if (ttl == 0) {
                                    handleHello(packet.address)
                                    continue
                                }
                                if (packet.length <= HEADER)
                                    continue

                                val key =
                                    (srcId.toLong() shl 32) or
                                    (rseq.toLong() and 0xFFFFFFFFL)
                                if (isDuplicate(key)) continue

                                val audioLen = packet.length - HEADER
                                onVoiceDetected(
                                    rmsOf(buf, HEADER, audioLen) >
                                        SPEECH_RMS,
                                    System.currentTimeMillis())

                                track.write(buf, HEADER, audioLen)
                                echoTrack?.write(buf, HEADER, audioLen)

                                if (relayEnabled && ttl > 1) {
                                    val fwd = buildPacket(
                                        buf, audioLen, srcId,
                                        rseq, ttl - 1)
                                    for (p in peers) {
                                        if (p == packet.address)
                                            continue
                                        try {
                                            socket?.send(
                                                DatagramPacket(
                                                    fwd, fwd.size,
                                                    p, AUDIO_PORT))
                                        } catch (e: Exception) {}
                                    }
                                }
                            } catch (e: Exception) {
                                break
                            }
                        }
                        track.stop()
                        track.release()
                    } catch (e: Exception) {
                        setStatus(
                            "Ошибка аудио: ${e.message}", false)
                    }
                }

                // ================= Отправка =================

                private fun sendLoop() {
                    try {
                        val minBuf =
                            AudioRecord.getMinBufferSize(
                                SAMPLE_RATE,
                                AudioFormat.CHANNEL_IN_MONO,
                                AudioFormat.ENCODING_PCM_16BIT)
                        val rec = AudioRecord(
                            MediaRecorder.AudioSource.MIC,
                            SAMPLE_RATE,
                            AudioFormat.CHANNEL_IN_MONO,
                            AudioFormat.ENCODING_PCM_16BIT,
                            maxOf(minBuf, SAMPLE_RATE * 2))

                        rec.startRecording()
                        val buf = ShortArray(1600)

                        while (running) {
                            val n = rec.read(buf, 0, buf.size)
                            if (n <= 0) continue

                            var sum = 0.0
                            for (i in 0 until n) {
                                sum += buf[i].toDouble() *
                                    buf[i]
                            }
                            val rms = Math.sqrt(sum / n)

                            val bytes = ByteArray(n * 2)
                            val g = voiceGain
                            for (i in 0 until n) {
                                var v = (buf[i] * g).toInt()
                                if (v > 32767) v = 32767
                                if (v < -32768) v = -32768
                                bytes[2 * i] =
                                    (v and 0xFF).toByte()
                                bytes[2 * i + 1] =
                                    (v shr 8 and 0xFF).toByte()
                            }

                            if (micEnabled && peers.isNotEmpty()) {
                                onVoiceDetected(
                                    rms > SPEECH_RMS,
                                    System.currentTimeMillis())

                                val s = seq.incrementAndGet()
                                val out = buildPacket(
                                    bytes, bytes.size, myId, s,
                                    MAX_HOPS)
                                for (p in peers) {
                                    try {
                                        socket?.send(
                                            DatagramPacket(
                                                out, out.size,
                                                p, AUDIO_PORT))
                                    } catch (e: Exception) {}
                                }
                            } else if (!micEnabled && focusHeld) {
                                abandonFocus()
                            }
                        }
                        rec.stop()
                        rec.release()
                    } catch (e: Exception) {
                        setStatus(
                            "Ошибка микрофона: ${e.message}", false)
                    }
                }

                // ================= Пауза музыки =================

                private fun onVoiceDetected(
                    loud: Boolean, now: Long
                ) {
                    if (musicFirst) {
                        if (focusHeld) abandonFocus()
                        return
                    }
                    if (loud) {
                        speechFrames++
                        if (speechFrames >= 3) {
                            if (!focusHeld) requestFocus()
                            lastSpeechTime = now
                        }
                    } else {
                        speechFrames = 0
                    }
                    if (focusHeld &&
                        now - lastSpeechTime >
                        musicDelaySec * 1000L
                    ) {
                        abandonFocus()
                    }
                }

                private fun requestFocus() {
                    val req = AudioFocusRequest.Builder(
                        AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                        .setAudioAttributes(
                            AudioAttributes.Builder()
                                .setUsage(
                                    AudioAttributes.USAGE_MEDIA)
                                .setContentType(
                                    AudioAttributes
                                        .CONTENT_TYPE_SPEECH)
                                .build())
                        .build()
                    focusRequest = req
                    focusHeld = audioManager.requestAudioFocus(
                        req) == AudioManager
                        .AUDIOFOCUS_REQUEST_GRANTED
                    if (focusHeld) {
                        setStatus(
                            "Музыка на паузе (идёт разговор)", true)
                    }
                }
