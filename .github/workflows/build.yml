name: Build APK

"on":
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write sources
        env:
          KT_SRC: |
            package com.example.intercom

            import android.Manifest
            import android.annotation.SuppressLint
            import android.app.Activity
            import android.bluetooth.BluetoothAdapter
            import android.content.BroadcastReceiver
            import android.content.Context
            import android.content.Intent
            import android.content.IntentFilter
            import android.content.pm.PackageManager
            import android.graphics.Color
            import android.graphics.Typeface
            import android.media.*
            import android.net.nsd.NsdManager
            import android.net.nsd.NsdServiceInfo
            import android.net.wifi.WifiManager
            import android.os.Build
            import android.os.Bundle
            import android.view.Gravity
            import android.view.View
            import android.view.ViewGroup
            import android.widget.*
            import java.net.DatagramPacket
            import java.net.DatagramSocket
            import java.net.InetAddress
            import java.nio.ByteBuffer
            import java.util.concurrent.CopyOnWriteArraySet
            import java.util.concurrent.atomic.AtomicInteger
            import kotlin.concurrent.thread
            import kotlin.random.Random

            class MainActivity : Activity() {

                companion object {
                    const val SAMPLE_RATE = 16000
                    const val AUDIO_PORT = 45678
                    const val SERVICE_TYPE = "_intercom._tcp."
                    const val SERVICE_PREFIX = "intercom-"
                    const val REQUEST_MIC = 1
                    const val PREFS = "intercom_prefs"
                    const val KEY_DELAY = "musicDelay"
                    const val KEY_THEME = "theme"
                    const val KEY_RELAY = "relay"
                    const val KEY_MUSIC_FIRST = "musicFirst"
                    const val KEY_VOICE_GAIN = "voiceGain"
                    const val KEY_TALK_VOL = "talkVolume"
                    const val MAX_HOPS = 3
                    const val HEADER = 9
                    const val SPEECH_RMS = 1200.0
                }

                private lateinit var nsdManager: NsdManager
                private lateinit var audioManager: AudioManager

                private val myId = Random.nextInt()
                private val seq = AtomicInteger(0)

                private val peers = CopyOnWriteArraySet<InetAddress>()
                private val foundDevices = LinkedHashMap<String, NsdServiceInfo>()
                private val resolveQueue = ArrayDeque<NsdServiceInfo>()
                private var resolving = false
                private var myServiceName: String? = null

                private var socket: DatagramSocket? = null
                private var running = false
                private var micEnabled = true
                private var musicDelaySec = 2
                private var themeMode = 0
                private var relayEnabled = true
                private var musicFirst = false
                private var voiceGain = 1.0f
                private var talkVolume = 100
                private var speechFrames = 0

                private val recentPackets = LinkedHashMap<Long, Boolean>()

                private var focusRequest: AudioFocusRequest? = null
                private var focusHeld = false
                private var lastSpeechTime = 0L

                private var echoTrack: AudioTrack? = null
                private var recvTrack: AudioTrack? = null
                private var scoActive = false

                private var p2p: android.net.wifi.WifiP2pManager? = null
                private var p2pChannel: android.net.wifi.WifiP2pManager.Channel? = null
                private var owner: InetAddress? = null
                private val p2pTried = CopyOnWriteArraySet<String>()

                private lateinit var mainScreen: LinearLayout
                private lateinit var settingsScreen: LinearLayout

                private lateinit var statusView: TextView
                private lateinit var devicesView: TextView
                private lateinit var micButton: Button
                private lateinit var foundListLayout: LinearLayout
                private var talkVolumeBar: SeekBar? = null
                private var musicVolumeBar: SeekBar? = null
                private var voiceGainBar: SeekBar? = null
                private var voiceGainLabel: TextView? = null

                private var delaySpinner: Spinner? = null
                private var themeSpinner: Spinner? = null
                private var relayCheck: CheckBox? = null
                private var musicFirstCheck: CheckBox? = null

                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    title = "Интерком"
                    audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                    volumeControlStream = AudioManager.STREAM_MUSIC

                    val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                    musicDelaySec = prefs.getInt(KEY_DELAY, 2).coerceIn(0, 5)
                    themeMode = prefs.getInt(KEY_THEME, 0)
                    relayEnabled = prefs.getBoolean(KEY_RELAY, true)
                    musicFirst = prefs.getBoolean(KEY_MUSIC_FIRST, false)
                    voiceGain = prefs.getInt(KEY_VOICE_GAIN, 100) / 100f
                    talkVolume = prefs.getInt(KEY_TALK_VOL, 100).coerceIn(0, 100)

                    buildUi()

                    val perms = ArrayList<String>()
                    perms.add(Manifest.permission.RECORD_AUDIO)
                    perms.add(Manifest.permission.ACCESS_FINE_LOCATION)
                    if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                    requestPermissions(perms.toTypedArray(), REQUEST_MIC)
                }

                override fun onRequestPermissionsResult(
                    requestCode: Int, permissions: Array<out String>, grantResults: IntArray
                ) {
                    super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                    if (requestCode == REQUEST_MIC) {
                        var micOk = false
                        for (i in grantResults.indices) {
                            if (permissions[i] == Manifest.permission.RECORD_AUDIO &&
                                grantResults[i] == PackageManager.PERMISSION_GRANTED) micOk = true
                        }
                        if (micOk) startAll() else setStatus("Нет разрешения на микрофон", false)
                    }
                }

                private fun startAll() {
                    val wifi = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                    val lock = wifi.createMulticastLock("intercom-lock")
                    lock.setReferenceCounted(false)
                    lock.acquire()

                    enableBluetoothSco()
                    initP2p()

                    running = true
                    socket = try {
                        DatagramSocket(AUDIO_PORT).apply { broadcast = true; reuseAddress = true }
                    } catch (e: Exception) {
                        null
                    }
                    if (socket == null) {
                        setStatus("Порт занят. Перезапустите приложение", false)
                        return
                    }

                    thread(name = "recv") { receiveLoop() }
                    thread(name = "send") { sendLoop() }
                    thread(name = "hello") { helloLoop() }
                    registerNsd()
                    setStatus("Микрофон активен. Поиск: Wi-Fi Direct + broadcast", true)
                }

                @SuppressLint("MissingPermission")
                private fun enableBluetoothSco() {
                    try {
                        val bt = BluetoothAdapter.getDefaultAdapter()
                        if (bt == null || !bt.isEnabled) return
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                            val scoDevice = audioManager.availableCommunicationDevices.firstOrNull {
                                it.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO
                            }
                            if (scoDevice != null) {
                                audioManager.setCommunicationDevice(scoDevice)
                                scoActive = true
                            }
                        } else {
                            audioManager.startBluetoothSco()
                            audioManager.isBluetoothScoOn = true
                            scoActive = true
                        }
                    } catch (e: SecurityException) {
                        // Нет разрешения на Bluetooth, используется обычный микрофон
                    }
                }

                // ================= Wi-Fi Direct: соединение без роутера =================

                private fun initP2p() {
                    try {
                        p2p = getSystemService(Context.WIFI_P2P_SERVICE) as android.net.wifi.WifiP2pManager
                        p2pChannel = p2p!!.initialize(this, mainLooper, null)
                        val f = IntentFilter().apply {
                            addAction(android.net.wifi.WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION)
                            addAction(android.net.wifi.WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION)
                        }
                        registerReceiver(p2pReceiver, f)
                        discoverPeers()
                    } catch (e: Exception) {
                        setStatus("Wi-Fi Direct недоступен: ${e.message}", false)
                    }
                }

                private val p2pReceiver = object : BroadcastReceiver() {
                    override fun onReceive(c: Context, i: Intent) {
                        when (i.action) {
                            android.net.wifi.WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION ->
                                try {
                                    p2p?.requestPeers(p2pChannel) { list: android.net.wifi.WifiP2pDeviceList ->
                                        onP2pPeers(list) }
                                } catch (e: Exception) {}
                            android.net.wifi.WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION ->
                                try {
                                    p2p?.requestConnectionInfo(p2pChannel) { info: android.net.wifi.WifiP2pInfo ->
                                        onP2pInfo(info) }
                                } catch (e: Exception) {}
                        }
                    }
                }

                @SuppressLint("MissingPermission")
                private fun discoverPeers() {
                    p2p?.discoverPeers(p2pChannel, object : android.net.wifi.WifiP2pManager.ActionListener {
                        override fun onSuccess() {}
                        override fun onFailure(r: Int) {
                            if (owner == null && peers.isEmpty())
                                setStatus("Wi-Fi Direct не запущен, работает broadcast-канал", true)
                        }
                    })
                }

                @SuppressLint("MissingPermission")
                private fun onP2pPeers(list: android.net.wifi.WifiP2pDeviceList) {
                    for (d in list.deviceList) {
                        val addr = d.deviceAddress
                        if (addr == null || addr in p2pTried) continue
                        p2pTried.add(addr)
                        val cfg = android.net.wifi.WifiP2pConfig()
                        cfg.deviceAddress = addr
                        val devName = d.deviceName
                        p2p?.connect(p2pChannel, cfg, object : android.net.wifi.WifiP2pManager.ActionListener {
                            override fun onSuccess() {
                                setStatus("Wi-Fi Direct: подключаюсь к $devName", true)
                            }
                            override fun onFailure(r: Int) {}
                        })
                    }
                }

                private fun onP2pInfo(info: android.net.wifi.WifiP2pInfo) {
                    if (info.groupFormed && info.groupOwnerAddress != null) {
                        val addr = info.groupOwnerAddress
                        owner = addr
                        if (peers.add(addr)) {
                            setStatus("Wi-Fi Direct: соединение установлено. Говорите!", true)
                            runOnUiThread { refreshLists() }
                        }
                    }
                }

                // ================= Автопоиск: NSD + broadcast =================

                private fun registerNsd() {
                    nsdManager = getSystemService(Context.NSD_SERVICE) as NsdManager

                    val info = NsdServiceInfo().apply {
                        serviceName = SERVICE_PREFIX + Build.MODEL.replace(" ", "_")
                        serviceType = SERVICE_TYPE
                        port = AUDIO_PORT
                    }

                    nsdManager.registerService(info, NsdManager.PROTOCOL_DNS_SD,
                        object : NsdManager.RegistrationListener {
                            override fun onServiceRegistered(n: NsdServiceInfo) {
                                myServiceName = n.serviceName
                            }
                            override fun onRegistrationFailed(n: NsdServiceInfo, e: Int) {}
                            override fun onServiceUnregistered(n: NsdServiceInfo) {}
                            override fun onUnregistrationFailed(n: NsdServiceInfo, e: Int) {}
                        })

                    nsdManager.discoverServices(SERVICE_TYPE, NsdManager.PROTOCOL_DNS_SD,
                        object : NsdManager.DiscoveryListener {
                            override fun onDiscoveryStarted(t: String) {}
                            override fun onStartDiscoveryFailed(t: String, e: Int) {}
                            override fun onStopDiscoveryFailed(t: String, e: Int) {}
                            override fun onDiscoveryStopped(t: String) {}
                            override fun onServiceLost(info: NsdServiceInfo) {}
                            override fun onServiceFound(info: NsdServiceInfo) {
                                if (info.serviceName == myServiceName) return
                                var isNew = false
                                synchronized(foundDevices) {
                                    if (!foundDevices.containsKey(info.serviceName)) {
                                        foundDevices[info.serviceName] = info
                                        isNew = true
                                    }
                                }
                                if (isNew) {
                                    runOnUiThread { refreshLists() }
                                    queueResolve(info)
                                }
                            }
                        })
                }

                private fun queueResolve(info: NsdServiceInfo) {
                    synchronized(resolveQueue) { resolveQueue.addLast(info) }
                    tryResolveNext()
                }

                private fun tryResolveNext() {
                    val next: NsdServiceInfo = synchronized(resolveQueue) {
                        if (resolving || resolveQueue.isEmpty()) return
                        resolving = true
                        resolveQueue.removeFirst()
                    }
                    try {
                        nsdManager.resolveService(next, object : NsdManager.ResolveListener {
                            override fun onServiceResolved(resolved: NsdServiceInfo) {
                                val host = resolved.host
                                if (host != null && peers.add(host)) {
                                    runOnUiThread { refreshLists() }
                                }
                                finishResolve()
                            }
                            override fun onResolveFailed(i: NsdServiceInfo, e: Int) {
                                finishResolve()
                            }
                        })
                    } catch (e: Exception) {
                        finishResolve()
                    }
                }

                private fun finishResolve() {
                    synchronized(resolveQueue) { resolving = false }
                    tryResolveNext()
                }

                private fun helloLoop() {
                    var n = 0
                    while (running) {
                        try {
                            val out = buildPacket(ByteArray(0), 0, myId, seq.incrementAndGet(), 0)
                            socket?.send(DatagramPacket(out, out.size,
                                InetAddress.getByName("255.255.255.255"), AUDIO_PORT))
                            owner?.let { o ->
                                socket?.send(DatagramPacket(out, out.size, o, AUDIO_PORT))
                            }
                            if (n % 4 == 0) discoverPeers()
                        } catch (e: Exception) {}
                        n++
                        try {
                            Thread.sleep(3000)
                        } catch (e: InterruptedException) { break }
                    }
                }

                private fun handleHello(addr: InetAddress?) {
                    if (addr == null) return
                    if (peers.add(addr)) {
                        try {
                            val out = buildPacket(ByteArray(0), 0, myId, seq.incrementAndGet(), 0)
                            socket?.send(DatagramPacket(out, out.size, addr, AUDIO_PORT))
                        } catch (e: Exception) {}
                        runOnUiThread { refreshLists() }
                    }
                }

                private fun refreshLists() {
                    devicesView.text = if (peers.isEmpty()) "нет подключений"
                        else peers.joinToString("\n") { "• $it" }
                    foundListLayout.removeAllViews()
                    val names: List<String> = synchronized(foundDevices) { foundDevices.keys.toList() }
                    if (names.isEmpty()) {
                        foundListLayout.addView(TextView(this).apply {
                            text = "Идёт автоматический поиск..."
                        })
                    } else {
                        for (name in names) {
                            foundListLayout.addView(TextView(this).apply {
                                text = "• ${name.removePrefix(SERVICE_PREFIX)}"
                                textSize = 16f
                            })
                        }
                    }
                }

                // ================= Пакеты =================

                private fun buildPacket(audio: ByteArray, audioLen: Int, srcId: Int, seqNum: Int, ttl: Int): ByteArray {
                    val bb = ByteBuffer.allocate(audioLen + HEADER)
                    bb.putInt(srcId)
                    bb.putInt(seqNum)
                    bb.put(ttl.toByte())
                    bb.put(audio, 0, audioLen)
                    return bb.array()
                }

                private fun isDuplicate(key: Long): Boolean {
                    synchronized(recentPackets) {
                        if (recentPackets.containsKey(key)) return true
                        recentPackets[key] = true
                        if (recentPackets.size > 512) {
                            val it = recentPackets.entries.iterator()
                            if (it.hasNext()) { it.next(); it.remove() }
                        }
                        return false
                    }
                }

                private fun rmsOf(bytes: ByteArray, offset: Int, len: Int): Double {
                    var sum = 0.0
                    var count = 0
                    var i = offset
                    val end = offset + len - 1
                    while (i < end) {
                        val v = ((bytes[i].toInt() and 0xFF) or (bytes[i + 1].toInt() shl 8)).toShort().toDouble()
                        sum += v * v
                        count += 2
                        i += 2
                    }
                    return if (count == 0) 0.0 else Math.sqrt(sum / count)
                }

                // ================= Приём и ретрансляция =================

                private fun pcmOutFormat(): AudioFormat =
                    AudioFormat.Builder().setSampleRate(SAMPLE_RATE)
                        .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                        .setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build()

                private fun receiveLoop() {
                    try {
                        val minBuf = AudioTrack.getMinBufferSize(
                            SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                        val track = AudioTrack(
                            AudioAttributes.Builder()
                                .setUsage(AudioAttributes.USAGE_MEDIA)
                                .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                .build(),
                            pcmOutFormat(), maxOf(minBuf, SAMPLE_RATE * 2),
                            AudioTrack.MODE_STREAM, 0)
                        recvTrack = track
                        track.setVolume(talkVolume / 100f)
                        track.play()

                        val buf = ByteArray(6400)
                        while (running) {
                            try {
                                val packet = DatagramPacket(buf, buf.size)
                                socket?.receive(packet)
                                if (packet.length < HEADER) continue

                                val bb = ByteBuffer.wrap(buf, 0, packet.length)
                                val srcId = bb.int
                                val rseq = bb.int
                                val ttl = bb.get().toInt()

                                if (srcId == myId) continue

                                if (ttl == 0) {
                                    handleHello(packet.address)
                                    continue
                                }
                                if (packet.length <= HEADER) continue

                                val key = (srcId.toLong() shl 32) or (rseq.toLong() and 0xFFFFFFFFL)
                                if (isDuplicate(key)) continue

                                val audioLen = packet.length - HEADER
                                onVoiceDetected(rmsOf(buf, HEADER, audioLen) > SPEECH_RMS,
                                    System.currentTimeMillis())

                                track.write(buf, HEADER, audioLen)
                                echoTrack?.write(buf, HEADER, audioLen)

                                if (relayEnabled && ttl > 1) {
                                    val fwd = buildPacket(buf, audioLen, srcId, rseq, ttl - 1)
                                    for (p in peers) {
                                        if (p == packet.address) continue
                                        try {
                                            socket?.send(DatagramPacket(fwd, fwd.size, p, AUDIO_PORT))
                                        } catch (e: Exception) {}
                                    }
                                }
                            } catch (e: Exception) { break }
                        }
                        track.stop(); track.release()
                    } catch (e: Exception) {
                        setStatus("Ошибка аудио: ${e.message}", false)
                    }
                }

                // ================= Отправка =================

                private fun sendLoop() {
                    try {
                        val minBuf = AudioRecord.getMinBufferSize(
                            SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                        val rec = AudioRecord(
                            MediaRecorder.AudioSource.MIC,
                            SAMPLE_RATE,
                            AudioFormat.CHANNEL_IN_MONO,
                            AudioFormat.ENCODING_PCM_16BIT,
                            maxOf(minBuf, SAMPLE_RATE * 2))

                        rec.startRecording()
                        val buf = ShortArray(1600)

                        while (running) {
                            val n = rec.read(buf, 0, buf.size)
                            if (n <= 0) continue

                            var sum = 0.0
                            for (i in 0 until n) sum += buf[i].toDouble() * buf[i]
                            val rms = Math.sqrt(sum / n)

                            val bytes = ByteArray(n * 2)
                            val g = voiceGain
                            for (i in 0 until n) {
                                var v = (buf[i] * g).toInt()
                                if (v > 32767) v = 32767
                                if (v < -32768) v = -32768
                                bytes[2 * i] = (v and 0xFF).toByte()
                                bytes[2 * i + 1] = (v shr 8 and 0xFF).toByte()
                            }

                            if (micEnabled && peers.isNotEmpty()) {
                                onVoiceDetected(rms > SPEECH_RMS, System.currentTimeMillis())

                                val s = seq.incrementAndGet()
                                val out = buildPacket(bytes, bytes.size, myId, s, MAX_HOPS)
                                for (p in peers) {
                                    try {
                                        socket?.send(DatagramPacket(out, out.size, p, AUDIO_PORT))
                                    } catch (e: Exception) {}
                                }
                            } else if (!micEnabled && focusHeld) {
                                abandonFocus()
                            }
                        }
                        rec.stop(); rec.release()
                    } catch (e: Exception) {
                        setStatus("Ошибка микрофона: ${e.message}", false)
                    }
                }

                // ================= Пауза музыки =================

                private fun onVoiceDetected(loud: Boolean, now: Long) {
                    if (musicFirst) {
                        if (focusHeld) abandonFocus()
                        return
                    }
                    if (loud) {
                        speechFrames++
                        if (speechFrames >= 3) {
                            if (!focusHeld) requestFocus()
                            lastSpeechTime = now
                        }
                    } else {
                        speechFrames = 0
                    }
                    if (focusHeld && now - lastSpeechTime > musicDelaySec * 1000L) {
                        abandonFocus()
                    }
                }

                private fun requestFocus() {
                    val req = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                        .setAudioAttributes(
                            AudioAttributes.Builder()
                                .setUsage(AudioAttributes.USAGE_MEDIA)
                                .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                        .build()
                    focusRequest = req
                    focusHeld = audioManager.requestAudioFocus(req) == AudioManager.AUDIOFOCUS_REQUEST_GRANTED
                    if (focusHeld) setStatus("Музыка на паузе (идёт разговор)", true)
                }

                private fun abandonFocus() {
                    focusRequest?.let { audioManager.abandonAudioFocusRequest(it) }
                    focusRequest = null
                    focusHeld = false
                    speechFrames = 0
                }

                // ================= Оформление =================

                private fun applyBackground(view: View) {
                    if (view is CheckBox) {
                        view.setTextColor(if (themeMode == 0) Color.BLACK else Color.WHITE)
                    } else if (view is Button) {
                        // Цвет кнопок не зависит от темы
                    } else {
                        view.setBackgroundColor(if (themeMode == 0) 0xFFF8F9FA.toInt() else 0xFF1E1E1E.toInt())
                        if (view is TextView) {
                            view.setTextColor(if (themeMode == 0) Color.BLACK else Color.WHITE)
                        }
                    }
                    if (view is ViewGroup) {
                        for (i in 0 until view.childCount) applyBackground(view.getChildAt(i))
                    }
                }

                private fun boldLabel(text: String): TextView = TextView(this).apply {
                    this.text = text
                    setTypeface(Typeface.DEFAULT_BOLD)
                    textSize = 17f
                }

                private fun styledButton(text: String, color: Int): Button = Button(this).apply {
                    this.text = text
                    textSize = 17f
                    setTypeface(Typeface.DEFAULT_BOLD)
                    setTextColor(Color.WHITE)
                    isAllCaps = false
                    backgroundTintList = android.content.res.ColorStateList.valueOf(color)
                    layoutParams = LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                }

                // ================= Интерфейс =================

                private fun buildUi() {
                    val d = resources.displayMetrics.density
                    val pad = (16 * d).toInt()

                    statusView = TextView(this)
                    devicesView = TextView(this)
                    foundListLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                    micButton = styledButton("Микрофон: ВКЛ", 0xFF1A73E8.toInt()).apply {
                        setOnClickListener {
                            micEnabled = !micEnabled
                            if (micEnabled) {
                                text = "Микрофон: ВКЛ"
                                backgroundTintList = android.content.res.ColorStateList.valueOf(0xFF1A73E8.toInt())
                            } else {
                                text = "Микрофон: ВЫКЛ"
                                backgroundTintList = android.content.res.ColorStateList.valueOf(0xFF607D8B.toInt())
                            }
                            if (!micEnabled && focusHeld) abandonFocus()
                        }
                    }

                    val testButton = styledButton("Проверка связи (эхо 3 сек)", 0xFF28A745.toInt()).apply {
                        setOnClickListener {
                            if (!running) return@setOnClickListener
                            val minBuf = AudioTrack.getMinBufferSize(
                                SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                            val track = AudioTrack(
                                AudioAttributes.Builder()
                                    .setUsage(AudioAttributes.USAGE_MEDIA)
                                    .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build(),
                                pcmOutFormat(), maxOf(minBuf, SAMPLE_RATE * 2), AudioTrack.MODE_STREAM, 0)
                            track.setVolume(talkVolume / 100f)
                            echoTrack = track
                            thread {
                                track.play()
                                Thread.sleep(3000)
                                track.stop(); track.release()
                                echoTrack = null
                            }
                            Toast.makeText(this@MainActivity, "Говорите, услышите себя 3 секунды", Toast.LENGTH_SHORT).show()
                        }
                    }

                    val settingsButton = styledButton("Настройки", 0xFF7B1FA2.toInt()).apply {
                        setOnClickListener {
                            mainScreen.visibility = View.GONE
                            settingsScreen.visibility = View.VISIBLE
                        }
                    }

                    talkVolumeBar = SeekBar(this).apply {
                        max = 100
                        progress = talkVolume
                        setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                            override fun onProgressChanged(s: SeekBar?, vol: Int, fromUser: Boolean) {
                                if (fromUser) {
                                    talkVolume = vol
                                    recvTrack?.setVolume(vol / 100f)
                                    echoTrack?.setVolume(vol / 100f)
                                    getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                        .edit().putInt(KEY_TALK_VOL, vol).apply()
                                }
                            }
                            override fun onStartTrackingTouch(s: SeekBar?) {}
                            override fun onStopTrackingTouch(s: SeekBar?) {}
                        })
                    }

                    val header = LinearLayout(this).apply {
                        orientation = LinearLayout.HORIZONTAL
                        gravity = Gravity.CENTER
                    }
                    header.addView(ImageView(this).apply {
                        setImageResource(R.mipmap.ic_launcher)
                        layoutParams = LinearLayout.LayoutParams((64 * d).toInt(), (64 * d).toInt())
                    })
                    header.addView(TextView(this).apply {
                        text = "Интерком"
                        textSize = 28f
                        setTypeface(Typeface.DEFAULT_BOLD)
                        setPadding((12 * d).toInt(), 0, 0, 0)
                    })

                    mainScreen = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        setPadding(pad, pad, pad, pad)
                        addView(header)
                        addView(TextView(this@MainActivity).apply {
                            text = "Говорите без кнопок. Соединение через Wi-Fi Direct без роутера."
                            textSize = 16f
                        })
                        addView(boldLabel("Громкость разговора:").apply { setPadding(0, pad, 0, 0) })
                        addView(talkVolumeBar)
                        addView(micButton)
                        addView(testButton)
                        addView(settingsButton)
                        addView(statusView)
                        addView(boldLabel("Найденные устройства:").apply { setPadding(0, pad, 0, pad / 2) })
                        addView(foundListLayout)
                        addView(boldLabel("Активные соединения:").apply { setPadding(0, pad, 0, pad / 2) })
                        addView(devicesView)
                    }

                    // ---------- ЭКРАН НАСТРОЕК ----------

                    musicFirstCheck = CheckBox(this).apply {
                        text = "Музыка всегда на первом месте (не ставить на паузу)"
                        isChecked = musicFirst
                        setOnCheckedChangeListener { _, checked ->
                            musicFirst = checked
                            getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                .edit().putBoolean(KEY_MUSIC_FIRST, checked).apply()
                            if (checked) abandonFocus()
                        }
                    }

                    delaySpinner = Spinner(this).apply {
                        adapter = ArrayAdapter(this@MainActivity,
                            android.R.layout.simple_spinner_dropdown_item,
                            arrayOf("Пауза музыки: 0 сек", "Пауза музыки: 1 сек", "Пауза музыки: 2 сек",
                                    "Пауза музыки: 3 сек", "Пауза музыки: 4 сек", "Пауза музыки: 5 сек"))
                        setSelection(musicDelaySec)
                    }
                    delaySpinner!!.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                        override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                            musicDelaySec = pos
                            getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                .edit().putInt(KEY_DELAY, pos).apply()
                        }
                        override fun onNothingSelected(p: AdapterView<*>?) {}
                    }

                    voiceGainBar = SeekBar(this).apply {
                        max = 200
                        progress = (voiceGain * 100).toInt()
                    }
                    voiceGainLabel = boldLabel("Громкость голоса: ${(voiceGain * 100).toInt()}%")
                    voiceGainBar!!.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                        override fun onProgressChanged(s: SeekBar?, prog: Int, fromUser: Boolean) {
                            if (fromUser) {
                                val g = if (prog < 10) 10 else prog
                                voiceGain = g / 100f
                                voiceGainLabel?.text = "Громкость голоса: $g%"
                                getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                    .edit().putInt(KEY_VOICE_GAIN, g).apply()
                            }
                        }
                        override fun onStartTrackingTouch(s: SeekBar?) {}
                        override fun onStopTrackingTouch(s: SeekBar?) {}
                    })

                    musicVolumeBar = SeekBar(this).apply {
                        max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                        progress = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                        setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                            override fun onProgressChanged(s: SeekBar?, vol: Int, fromUser: Boolean) {
                                if (fromUser) audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, vol, 0)
                            }
                            override fun onStartTrackingTouch(s: SeekBar?) {}
                            override fun onStopTrackingTouch(s: SeekBar?) {}
                        })
                    }

                    relayCheck = CheckBox(this).apply {
                        text = "Ретрансляция звука: звук передаётся и через промежуточные устройства"
                        isChecked = relayEnabled
                        setOnCheckedChangeListener { _, checked ->
                            relayEnabled = checked
                            getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                .edit().putBoolean(KEY_RELAY, checked).apply()
                        }
                    }

                    themeSpinner = Spinner(this).apply {
                        adapter = ArrayAdapter(this@MainActivity,
                            android.R.layout.simple_spinner_dropdown_item,
                            arrayOf("Оформление: светлое", "Оформление: тёмное"))
                        setSelection(themeMode)
                    }
                    themeSpinner!!.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                        override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                            if (pos != themeMode) {
                                themeMode = pos
                                getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                    .edit().putInt(KEY_THEME, pos).apply()
                                recreate()
                            }
                        }
                        override fun onNothingSelected(p: AdapterView<*>?) {}
                    }

                    val backButton = styledButton("Назад", 0xFF546E7A.toInt()).apply {
                        setOnClickListener {
                            settingsScreen.visibility = View.GONE
                            mainScreen.visibility = View.VISIBLE
                        }
                    }

                    settingsScreen = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        setPadding(pad, pad, pad, pad)
                        visibility = View.GONE
                        addView(TextView(this@MainActivity).apply {
                            text = "Настройки"
                            textSize = 24f
                            setTypeface(Typeface.DEFAULT_BOLD)
                        })
                        addView(musicFirstCheck)
                        addView(boldLabel("Пауза музыки после разговора:").apply { setPadding(0, pad, 0, 0) })
                        addView(delaySpinner)
                        addView(boldLabel("Громкость голоса (насколько громко вас слышат):").apply { setPadding(0, pad, 0, 0) })
                        addView(voiceGainLabel)
                        addView(voiceGainBar)
                        addView(boldLabel("Громкость музыки:").apply { setPadding(0, pad, 0, 0) })
                        addView(musicVolumeBar)
                        addView(relayCheck)
                        addView(themeSpinner)
                        addView(TextView(this@MainActivity).apply {
                            text = "Все настройки сохраняются автоматически."
                            setPadding(0, pad, 0, 0)
                        })
                        addView(backButton)
                    }

                    val root = LinearLayout(this).apply {
                        orientation = LinearLayout.VERTICAL
                        addView(mainScreen)
                        addView(settingsScreen)
                    }
                    applyBackground(root)
                    setContentView(ScrollView(this).apply { addView(root) })
                }

                private fun setStatus(text: String, ok: Boolean) {
                    runOnUiThread {
                        statusView.text = "Статус: $text"
                        statusView.setTextColor(if (ok) 0xFF28A745.toInt() else 0xFFDC3545.toInt())
                    }
                }

                override fun onBackPressed() {
                    if (settingsScreen.visibility == View.VISIBLE) {
                        settingsScreen.visibility = View.GONE
                        mainScreen.visibility = View.VISIBLE
                    } else {
                        super.onBackPressed()
                    }
                }

                override fun onDestroy() {
                    super.onDestroy()
                    running = false
                    try { unregisterReceiver(p2pReceiver) } catch (e: Exception) {}
                    try {
                        p2p?.removeGroup(p2pChannel, object : android.net.wifi.WifiP2pManager.ActionListener {
                            override fun onSuccess() {}
                            override fun onFailure(r: Int) {}
                        })
                    } catch (e: Exception) {}
                    if (scoActive && Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                        try {
                            audioManager.isBluetoothScoOn = false
                            audioManager.stopBluetoothSco()
                        } catch (e: Exception) {}
                    }
                    try { socket?.close() } catch (e: Exception) {}
                    try { recvTrack?.stop(); recvTrack?.release() } catch (e: Exception) {}
                    try { echoTrack?.stop(); echoTrack?.release() } catch (e: Exception) {}
                    abandonFocus()
                }
            }
          MF_SRC: |
            <?xml version="1.0" encoding="utf-8"?>
