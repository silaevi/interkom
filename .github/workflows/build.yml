name: Build APK

"on":
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build_log.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Caused by|Exception" build_log.txt | head -25 | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intercom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
